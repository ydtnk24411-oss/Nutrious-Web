<div class="admin-login-page">
  <div class="admin-login-card">
    <!-- Logo -->
    <div class="admin-login-logo">
      <div class="admin-logo-mark">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#72c343" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
        </svg>
      </div>
      <h1>Xanh Lá Admin</h1>
      <p>Hệ thống Quản trị Thực phẩm Hữu cơ</p>
    </div>

    <!-- Error / Expired -->
    @if (error()) {
    <div class="admin-alert admin-alert-error" style="margin-bottom:20px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ error() }}</span>
    </div>
    }
    @if (expired()) {
    <div class="admin-alert admin-alert-info" style="margin-bottom:20px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span>Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.</span>
    </div>
    }

    <!-- Form -->
    <form (submit)="submit($event)" class="admin-login-form">
      <div class="admin-field">
        <label for="email">Tài khoản Email</label>
        <input id="email" type="email" placeholder="admin@xanhla.farm" [value]="email()"
          (input)="email.set($any($event.target).value)" required autocomplete="username" />
      </div>

      <div class="admin-field">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" placeholder="••••••••" [value]="password()"
          (input)="password.set($any($event.target).value)" required autocomplete="current-password" />
      </div>

      <button class="admin-btn-primary" type="submit" [disabled]="loading()"
        style="padding:12px;font-size:15px;margin-top:6px;justify-content:center">
        @if (loading()) {
        <span class="admin-spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,0.2)"></span>
        <span>Đang xác thực...</span>
        } @else {
        <span>Đăng nhập hệ thống</span>
        }
      </button>
    </form>

    <div class="admin-login-hint">
      Tài khoản mặc định: <code>admin&#64;xanhla.farm</code> / <code>admin123</code>
    </div>
  </div>
</div>
