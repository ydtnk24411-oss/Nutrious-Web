<div class="admin-login-page">
  <div class="admin-login-card">
    <!-- Logo -->
    <div class="admin-login-logo">
      <div class="admin-logo-mark" style="background:#ffffff;padding:4px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,0.08);width:58px;height:58px;display:inline-flex;align-items:center;justify-content:center;">
        <img src="/logo.png" alt="Evergreen Mart" style="width:100%;height:100%;object-fit:contain;" />
      </div>
      <h1>Evergreen Mart Admin</h1>
      <p>Hệ thống Quản trị Nông sản &amp; Thực phẩm Hữu cơ Evergreen Mart</p>
    </div>

    <!-- Error / Expired -->
    @if (error()) {
    <div class="admin-alert admin-alert-error" style="margin-bottom:20px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ error() }}</span>
    </div>
    }
    @if (expired()) {
    <div class="admin-alert admin-alert-info" style="margin-bottom:20px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <span>Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.</span>
    </div>
    }

    <!-- Form -->
    <form (submit)="submit($event)" class="admin-login-form">
      <div class="admin-field">
        <label for="email">Tài khoản Email</label>
        <input id="email" type="email" placeholder="admin@xanhla.farm" [value]="email()"
          (input)="email.set($any($event.target).value)" required autocomplete="username" />
      </div>

      <div class="admin-field">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" placeholder="••••••••" [value]="password()"
          (input)="password.set($any($event.target).value)" required autocomplete="current-password" />
      </div>

      <button class="admin-btn-primary" type="submit" [disabled]="loading() || googleLoading()"
        style="padding:12px;font-size:15px;margin-top:6px;justify-content:center">
        @if (loading()) {
        <span class="admin-spinner" style="border-top-color:#fff;border-color:rgba(255,255,255,0.2)"></span>
        <span>Đang xác thực...</span>
        } @else {
        <span>Đăng nhập hệ thống</span>
        }
      </button>

      <div style="display:flex;align-items:center;gap:12px;margin:18px 0 12px;color:#94a3b8;font-size:13px">
        <div style="flex:1;height:1px;background:#e2e8f0"></div>
        <span>hoặc</span>
        <div style="flex:1;height:1px;background:#e2e8f0"></div>
      </div>

      <button type="button" class="admin-btn-secondary" [disabled]="loading() || googleLoading()"
        (click)="loginWithGoogle()"
        style="width:100%;padding:11px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font-size:14px;font-weight:600;color:#1e293b;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.2s">
        @if (googleLoading()) {
          <span class="admin-spinner" style="border-top-color:#16a34a;border-color:rgba(0,0,0,0.1);width:16px;height:16px"></span>
          <span>Đang xác thực Google...</span>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Đăng nhập Admin bằng Google</span>
        }
      </button>
    </form>

    <div class="admin-login-hint">
      Tài khoản mặc định: <code>admin&#64;xanhla.farm</code> / <code>admin123</code>
    </div>
  </div>
</div>
